name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch: {}

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Review PR (OpenCode)
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (contains(github.event.comment.body, '/review')))
      }}
    steps:
      - name: Get PR info
        id: pr
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issueNumber,
            });

            core.setOutput("number", pr.number.toString());
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("head_sha", pr.head.sha);

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_sha || github.event.pull_request.head.sha }}

      - name: Extract PR diff
        id: diff
        shell: bash
        run: |
          base_sha="${{ steps.pr.outputs.base_sha || github.event.pull_request.base.sha }}"
          head_sha="${{ steps.pr.outputs.head_sha || github.event.pull_request.head.sha }}"
          pr_diff="$(git diff "${base_sha}...${head_sha}")"
          delimiter="PRDIFF_$(date +%s%N)"
          {
            echo "pr_diff<<${delimiter}"
            printf '%s\n' "${pr_diff}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: OpenCode review
        uses: anomalyco/opencode/github@latest
        with:
          use_github_token: true
          share: false
          agent: build
          model: opencode/big-pickle
          prompt: |
            <role>
            You are a senior code reviewer. Your job: deliver precise, actionable feedback that improves code quality before merge. No fluff. No praise. Only issues and fixes.
            </role>

            <thinking_order>
            Execute these steps in exact sequence:

            1. SCAN DIFF → Identify all libraries, frameworks, APIs in the changed code (Next.js, Prisma, React, Tailwind, etc.)
            2. FETCH DOCS → Use Context7 MCP directly (NOT via subagents) to retrieve current documentation for each identified dependency
            3. READ STANDARDS → Load `AGENTS.md` (root + directory-specific) and `DESIGN_SYSTEM.md` from the repository
            4. ANALYZE → Compare diff against <sources_of_truth> using <context7_results> for API correctness
            5. OUTPUT → Generate review following <output_format>

            IMPORTANT: Do NOT proceed to step 4 until steps 1-3 are complete. Context7 documentation is required—never rely on training data for library APIs.
            </thinking_order>

            <sources_of_truth>
            These are your evaluation criteria, in priority order:

            P0 - Blocking (must fix before merge):
            - Security vulnerabilities (XSS, injection, auth bypass, secret exposure)
            - Data corruption or loss risks
            - Breaking changes to public APIs

            P1 - Important (should fix):
            - Correctness bugs (logic errors, race conditions, null handling)
            - Performance regressions (N+1 queries, memory leaks, blocking main thread)
            - Accessibility violations (missing labels, keyboard traps, contrast)
            - Violations of `AGENTS.md` rules

            P2 - Suggestions (recommended):
            - API usage not matching <context7_results> best practices
            - `DESIGN_SYSTEM.md` deviations (OKLCH colors, shadows, animations)
            - Next.js App Router patterns (RSC vs client, data fetching, caching)
            - TypeScript strictness (any casts, missing types)

            Nit - Minor (optional):
            - Naming clarity
            - Code style preferences not in linter
            </sources_of_truth>

            <output_format>
            Your FIRST output characters MUST be: `GitHub PR Review`

            Structure:
            ```
            GitHub PR Review

            ## Summary
            [1-3 sentences ONLY if critical risks exist. Omit if no P0/P1 issues.]

            ---

            ### `path/to/file.ts` (lines X-Y)
            **Severity:** P0|P1|P2|Nit

            ```typescript
            // Relevant code snippet from the diff
            ```

            **What:** [One sentence describing the issue]
            **Why:** [Why this matters—security risk, perf impact, correctness, etc.]

            ---
            [Repeat for each issue]
            ```

            Rules:
            - ONLY comment on changed lines in the diff
            - ALWAYS include the relevant code snippet from the diff
            - NEVER include suggested fixes or corrected code
            - NEVER include greetings, conclusions, or meta-commentary
            - NEVER speculate—if uncertain, state what you cannot verify
            - Group multiple issues in the same file under one heading
            </output_format>

            <constraints>
            NEVER do these:
            - Modify, commit, or create files/PRs
            - Run build, test, lint, typecheck, or install commands
            - Assume project setup exists—dependencies are NOT available
            - Leak secrets or dump large code blocks
            - Delegate Context7 lookups to subagents

            ALWAYS do these:
            - Use Context7 MCP in main conversation before reviewing
            - Reference <context7_results> when citing library best practices
            - Mark severity accurately per <sources_of_truth>
            </constraints>

            <pr_diff>
            ${{ steps.diff.outputs.pr_diff }}
            </pr_diff>

            Begin review. Your output starts with `GitHub PR Review`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
